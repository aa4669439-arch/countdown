<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動倒數</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#f6f4ee}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;position:relative;overflow-x:hidden;color:#41564a;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:radial-gradient(ellipse at 8% 12%,#e4eadf99,transparent 47%),radial-gradient(ellipse at 95% 90%,#e7dbc780,transparent 45%),#f6f4ee;padding:40px 24px}
body:before,body:after{content:"";position:fixed;pointer-events:none;border:1px solid #a9b69f40;border-radius:48% 52% 60% 40%;width:520px;height:520px;z-index:0;transform:rotate(-24deg)}
body:before{left:-330px;top:-220px}body:after{right:-330px;bottom:-260px;width:640px;height:640px}
.wrap{position:relative;z-index:2;text-align:center;width:min(1080px,100%);padding:64px 56px 42px;border:1px solid #ffffff;border-radius:32px;background:linear-gradient(135deg,#ffffffb8,#fffdf8a6);box-shadow:0 24px 80px #605a4210,0 2px 8px #605a4205}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:12px;color:#87917c;font-size:11px;letter-spacing:3.5px;margin-bottom:22px}
.eyebrow:before,.eyebrow:after{content:"";width:32px;height:1px;background:#b8c1ad}
.title{font-size:clamp(28px,4.5vw,48px);font-weight:500;line-height:1.5;letter-spacing:3px;overflow-wrap:anywhere;color:#405747}
.sub{font-size:clamp(15px,2vw,19px);color:#8c8d80;margin:12px 0 0;line-height:1.8;letter-spacing:1.4px;overflow-wrap:anywhere}.sub:empty{display:none}
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:44px auto 0;max-width:864px}
.box{position:relative;padding:30px 10px 24px;border:1px solid #e8e9df;border-radius:22px;background:linear-gradient(160deg,#fff,#f8f8f2);box-shadow:0 9px 24px #67735c08;transition:transform .25s}
.box:before{content:"";display:block;width:23px;height:3px;border-radius:4px;background:var(--accent);margin:0 auto 20px}
.box:hover{transform:translateY(-3px)}
.num{font-size:clamp(38px,6.5vw,78px);font-family:"Segoe UI","Arial",sans-serif;font-weight:400;line-height:1.1;letter-spacing:-2px;color:#516b55;font-variant-numeric:tabular-nums}
.label{font-size:16px;color:#929585;letter-spacing:4px;padding-left:4px;margin-top:16px}
.b1{--accent:#91a68c}.b2{--accent:#bdc5af}.b3{--accent:#c7b99e}.b4{--accent:#aabac0}
.b1{background:linear-gradient(145deg,#eff3e9,#f9faf5);border-color:#dbe3d3}
.target{display:inline-block;margin-top:32px;padding:12px 22px;border:1px solid #e8e5d9;border-radius:99px;background:#f5f2eab0;font-size:clamp(13px,1.7vw,16px);color:#8b8471;line-height:1.7;letter-spacing:1px}
.footer{margin-top:32px;color:#aaa99a;font-size:10px;letter-spacing:3px}
.done{display:none;margin:44px auto 12px;padding:40px 20px;border:1px solid #dce4d4;border-radius:22px;background:#eef3e8;font-size:clamp(26px,5vw,46px);font-weight:500;color:#516b55;overflow-wrap:anywhere}
.tick{animation:reveal .3s ease}@keyframes reveal{from{opacity:.45;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.confetti{position:fixed;width:7px;height:11px;top:-20px;border-radius:2px;z-index:3;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(max-width:600px){body{padding:20px 14px}.wrap{padding:40px 18px 28px;border-radius:26px}.title{letter-spacing:1px}.boxes{gap:9px;margin-top:30px}.box{padding:22px 4px 20px;border-radius:15px}.box:before{margin-bottom:16px}.num{font-size:clamp(28px,8vw,46px);letter-spacing:-1px}.label{font-size:13px;margin-top:12px}.target{padding:10px 14px;letter-spacing:0}.eyebrow{font-size:9px;letter-spacing:2px}.footer{letter-spacing:2px}}
@media(max-width:340px){.boxes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.confetti{display:none}}
</style>
</head>
<body>

<main class="wrap">
  <div class="eyebrow">COUNTDOWN TO THE MOMENT</div>
  <h1 class="title" id="title">活動倒數</h1>
  <div class="sub" id="sub"></div>

  <div class="boxes" id="boxes">
    <div class="box b1"><div class="num" id="d">0</div><div class="label">天</div></div>
    <div class="box b2"><div class="num" id="h">00</div><div class="label">時</div></div>
    <div class="box b3"><div class="num" id="m">00</div><div class="label">分</div></div>
    <div class="box b4"><div class="num" id="s">00</div><div class="label">秒</div></div>
  </div>
  <div class="done" id="done" role="status">🎉 時間到囉！🎉</div>

  <div class="target" id="target"></div>
  <div class="footer">每一刻，都值得期待</div>
</main>

<script>
  // ===== 設定方式：網址後面加參數 =====
  // 例：countdown.html?title=UiPath競賽&date=2026-12-15T09:00&sub=一起加油
  const p = new URLSearchParams(location.search);
  const title = p.get("title") || "活動倒數";
  const sub   = p.get("sub")   || "";
  const dateStr = p.get("date") || "2026-12-12T13:40";   // 預設日期，可直接改這裡
  const doneText = p.get("done") || "🎉 時間到囉！🎉";

  const target = new Date(dateStr);
  document.getElementById("title").textContent = title;
  document.getElementById("sub").textContent = sub;
  document.getElementById("done").textContent = doneText;
  document.title = title;

  const w = ["日","一","二","三","四","五","六"];
  if (!isNaN(target)) {
    document.getElementById("target").textContent =
      `活動日期　${target.getFullYear()}/${target.getMonth()+1}/${target.getDate()}（${w[target.getDay()]}）` +
      `${String(target.getHours()).padStart(2,"0")}:${String(target.getMinutes()).padStart(2,"0")}`;
  } else {
    document.getElementById("target").textContent = "⚠️ 日期格式錯誤，請用 2026-12-31T17:00 這種寫法";
  }

  const last = {};
  function setNum(id, val) {
    const el = document.getElementById(id);
    if (last[id] !== val) {
      el.textContent = val;
      el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
      last[id] = val;
    }
  }

  let celebrated = false;
  function confetti() {
    const cs = ["#91a68c","#c7b99e","#aabac0","#d5d9c7","#e3d8bf"];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = cs[i % cs.length];
      c.style.animationDuration = (2 + Math.random() * 3) + "s";
      c.style.animationDelay = Math.random() * 1.5 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6000);
    }
  }

  function tick() {
    if (isNaN(target)) return;
    let diff = Math.floor((target - new Date()) / 1000);
    if (diff <= 0) {
      document.getElementById("boxes").style.display = "none";
      document.getElementById("done").style.display = "block";
      if (!celebrated) { celebrated = true; confetti(); }
      return;
    }
    setNum("d", Math.floor(diff / 86400));
    setNum("h", String(Math.floor(diff % 86400 / 3600)).padStart(2, "0"));
    setNum("m", String(Math.floor(diff % 3600 / 60)).padStart(2, "0"));
    setNum("s", String(diff % 60).padStart(2, "0"));
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
